<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // embedded / modal pages hide their bar BEFORE the first paint (it used to
  // flash while the page loaded)
  (function(q){ var c = document.documentElement.classList;
    if (/[?&]embed=/.test(q)) c.add('embed'); if (/[?&]modal=/.test(q)) c.add('modalonly');
    if (/[?&]inmodal=/.test(q)) c.add('inmodal');
    const th = (q.match(/[?&]theme=(wire|night)/) || [])[1]; if (th) c.add(th); })(location.search);
</script>
<meta charset="UTF-8">
<meta http-equiv="cache-control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map Viewer</title>
<link rel="stylesheet" href="../assets/leaflet.css">
<style>
  /* Circular Std -- cascade-sg.com's typeface (assets/fonts/) */
  @font-face{font-family:'Circular';src:url('../assets/fonts/circularstd-book.otf') format('opentype');font-weight:400;font-style:normal;font-display:swap;ascent-override:107.9%;descent-override:25.1%;line-gap-override:0%}
  @font-face{font-family:'Circular';src:url('../assets/fonts/circularstd-bookitalic.otf') format('opentype');font-weight:400;font-style:italic;font-display:swap;ascent-override:107.9%;descent-override:25.1%;line-gap-override:0%}
  @font-face{font-family:'Circular';src:url('../assets/fonts/circularstd-medium.otf') format('opentype');font-weight:500;font-style:normal;font-display:swap;ascent-override:107.9%;descent-override:25.1%;line-gap-override:0%}
  @font-face{font-family:'Circular';src:url('../assets/fonts/circularstd-bold.otf') format('opentype');font-weight:700;font-style:normal;font-display:swap;ascent-override:107.9%;descent-override:25.1%;line-gap-override:0%}
  @font-face{font-family:'Circular';src:url('../assets/fonts/circularstd-bolditalic.otf') format('opentype');font-weight:700;font-style:italic;font-display:swap;ascent-override:107.9%;descent-override:25.1%;line-gap-override:0%}
  @font-face{font-family:'Circular';src:url('../assets/fonts/circularstd-black.otf') format('opentype');font-weight:900;font-style:normal;font-display:swap;ascent-override:107.9%;descent-override:25.1%;line-gap-override:0%}
  :root{--ink:#1c2430;--muted:#6b7686;--accent:#0b6e4f;--bar:#ffffff}
  *{box-sizing:border-box}
  body{margin:0;height:100vh;display:flex;flex-direction:column;overflow:hidden;
    font:15px/1.4 Circular,"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}
  .bar{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bar);
    border-bottom:1px solid #e2e6eb;flex-wrap:wrap;z-index:1001}
  .bar a{color:var(--accent);text-decoration:none;font-weight:600}
  /* ?embed=1: the schematic world map shown inside the home page's map card
     (index.html Schematic switch) -- no page bar, the card is the frame */
  body.embed > .bar,html.embed body > .bar,html.modalonly body > .bar{display:none}
  html.modalonly body{background:transparent}
  body.modalonly{background:transparent}
  /* the pop-up's own page: nothing but the pop-up, from the very first paint
     (html.modalonly is set in <head>; body.modalonly only once the scripts
     have run -- till then its map area showed full-screen: the flash) */
  body.modalonly > .bar,body.modalonly #gmap,body.modalonly #stage,
  html.modalonly body > .bar,html.modalonly #gmap,html.modalonly #stage{display:none}
  /* embedded: tooltips are drawn by the home page (not clipped by the card) */
  body.embed .leaflet-tooltip{visibility:hidden}
  .leaflet-abshl-pane,.leaflet-abshl-pane canvas{pointer-events:none!important}
  /* abstract mode hover cards: the home page's tooltip cards, night palette */
  .leaflet-tooltip.tt{background:#0c1a3c;color:#f4e9d6;border:0;border-radius:0;padding:10px 12px;
    box-shadow:0 8px 26px rgba(0,0,0,.45);font:13px/1.35 Circular,"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    min-width:200px;max-width:320px;white-space:normal}
  .leaflet-tooltip.tt:before{display:none}
  .tt-h{font-weight:800;font-size:15px;letter-spacing:-.01em;line-height:1.2}
  .tt-n{color:rgba(244,233,214,.62);font-size:12px}
  .tt-meta{margin-top:6px;display:flex;flex-wrap:wrap;gap:4px}
  .tt-chip{font-size:10.5px;font-weight:600;letter-spacing:.3px;padding:1px 7px;background:rgba(244,233,214,.12)}
  .tt-ln{display:flex;align-items:center;gap:6px;font-weight:600;font-size:12px}
  .tt-sw{width:9px;height:9px;flex:none}
  .tt-nb{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:7px;font-size:11.5px}
  .tt-nb .pv{color:rgba(244,233,214,.62);overflow-wrap:anywhere}
  .tt-nb .nx{text-align:right;color:rgba(244,233,214,.62);overflow-wrap:anywhere}
  .tt-nb b{color:#f4e9d6;font-weight:600}
  .tt-nb .me{font-weight:800;color:#f28b4b}
  .tt-more{margin-top:7px;font-size:11px;color:rgba(244,233,214,.62)}
  .tt-row{margin-top:9px;padding-top:8px;border-top:1px solid rgba(244,233,214,.14)}
  .tt-meter{position:relative;height:6px;margin:6px 0 4px;background:rgba(244,233,214,.14)}
  .tt-meter i{position:absolute;left:0;top:0;bottom:0;background:#f28b4b;opacity:.55}
  .tt-meter s{position:absolute;top:-2px;bottom:-2px;width:1px;background:rgba(244,233,214,.5);text-decoration:none}
  .tt-meter b{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;background:#f28b4b}
  .tt-ends{display:flex;justify-content:space-between;gap:10px;font-size:10.5px;color:rgba(244,233,214,.62)}
  .tt-pos{margin-top:3px;font-size:11px;font-weight:600}
  .leaflet-tooltip.tt.day{background:#fff;color:#1c2430;box-shadow:0 8px 26px rgba(20,30,50,.18)}
  .tt.day .tt-n,.tt.day .tt-nb .pv,.tt.day .tt-nb .nx,.tt.day .tt-more,.tt.day .tt-ends{color:#6b7684}
  .tt.day .tt-nb b{color:#1c2430}
  .tt.day .tt-nb .me,.tt.day .tt-meter b{color:#d0451b;background:#d0451b}
  .tt.day .tt-nb .me{background:none}
  .tt.day .tt-meter{background:#e6eaef}
  .tt.day .tt-meter i{background:#d0451b}
  .tt.day .tt-meter s{background:#9aa5b1}
  .tt.day .tt-row{border-top-color:#e6eaef}
  .title{font-weight:600}
  .title small{color:var(--muted);font-weight:400;margin-left:6px}
  .seg{display:flex;border:1px solid #d5dbe3;border-radius:8px;overflow:hidden}
  .seg button{padding:6px 16px;font-size:.85rem;border:0;background:#fff;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .seg button:disabled{opacity:.35;cursor:default}
  .spacer{flex:1}
  .nav a,.bar .btn{border:1px solid #d5dbe3;background:#fff;border-radius:8px;padding:6px 12px;
    font-size:.85rem;cursor:pointer;color:var(--ink);text-decoration:none;font-weight:400}
  .nav a:hover,.bar .btn:hover{border-color:var(--accent)}
  #stage{flex:1;position:relative;overflow:hidden;background:#e9ecf0;cursor:grab;touch-action:none}
  #stage.drag{cursor:grabbing}
  #stage.loading > :not(#msg){visibility:hidden}       /* first frame = the fitted map, not its full-size load */
  #stage.hidden,#gmap.hidden,.seg.hidden,.btn.hidden{display:none}
  .layer{position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;will-change:transform}
  #clipB{position:absolute;inset:0;overflow:hidden;pointer-events:none}
  #divider{position:absolute;top:0;bottom:0;width:0;border-left:3px solid #fff;
    box-shadow:0 0 6px rgba(0,0,0,.45);cursor:ew-resize;z-index:6;touch-action:none}
  #divider .knob{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.35);
    display:flex;align-items:center;justify-content:center;font-size:.9rem;color:#444}
  .chip{position:absolute;top:10px;z-index:5;background:rgba(28,36,48,.75);color:#fff;
    padding:3px 12px;border-radius:99px;font-size:.75rem;pointer-events:none}
  #chipA{left:12px}
  #chipB{right:12px}
  #hud{position:absolute;bottom:12px;right:14px;background:rgba(28,36,48,.75);color:#fff;
    padding:4px 10px;border-radius:8px;font-size:.75rem;pointer-events:none;z-index:5}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);z-index:4}
  #gmap{flex:1;position:relative}
  #gmap .leaflet-container{width:100%;height:100%}
  @keyframes nboxIn{from{transform:scale(0)}to{transform:scale(1)}}
  .nbox-pre{transform-box:fill-box;transform-origin:0 0;transform:scale(0)}
  .nbox-in{transform-box:fill-box;transform-origin:0 0;animation:nboxIn .6s cubic-bezier(.2,.9,.3,1.12) both}
  .nbox-label span{display:block;min-width:2.2em;text-align:center;color:#fff;font:600 12px/1.7 Circular,"Segoe UI",system-ui,sans-serif;
    padding:0 8px;border-radius:0 0 6px 0;white-space:nowrap;cursor:pointer}
  .ninset{position:relative;width:168px;line-height:0;background:#fff;border:2px solid #fff;
    border-radius:4px;box-shadow:0 1px 6px rgba(0,0,0,.4);overflow:hidden;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .25s}
  .ninset.on{opacity:1;pointer-events:auto}
  .ninset.dark{background:#0c1a3c;border-color:#7f8fbf}
  .ninset img{display:block;width:100%;height:auto}
  .ninset-view{position:absolute;border:2px solid #ad1457;background:rgba(173,20,87,.15);
    box-sizing:border-box;min-width:4px;min-height:4px;pointer-events:none}
  @media (max-width: 640px){ .ninset{width:98px} }
  .nbox-swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 5px 0 2px;
    vertical-align:-1px}
  #modal{position:fixed;inset:0;z-index:2000;background:rgba(28,36,48,.55);
    display:flex;align-items:center;justify-content:center;padding:24px}
  #modal.hidden{display:none}
  /* entrance and exit: the backdrop fades, the panel fades up with a slight lift */
  #modal.in{animation:mFade .24s ease-out}
  #modal.in .mbox{animation:mRise .3s cubic-bezier(.2,.9,.3,1)}
  #modal.waiting{visibility:hidden}                 /* laid out (its page loads at full size), not seen */
  #modal.closing{animation:mFadeOut .2s ease-in forwards}
  #modal.closing .mbox{animation:mSink .2s ease-in forwards}
  @keyframes mFade{from{opacity:0}}
  @keyframes mRise{from{opacity:0;transform:translateY(14px) scale(.985)}}
  @keyframes mFadeOut{to{opacity:0}}
  @keyframes mSink{to{opacity:0;transform:translateY(10px) scale(.985)}}
  @media (prefers-reduced-motion: reduce){ #modal, #modal .mbox{animation:none!important} }
  #modal .mbox{position:relative;display:flex;flex-direction:column;width:min(1400px,100%);height:100%;
    background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)}
  #mmap{flex:1;background:#e9ecf0}
  /* scrollbars in each mode's look (the same as the home page): day -- a soft
     grey pill; night -- a cream pill turning orange; wire -- a square green
     wireframe that fills on hover */
  ::-webkit-scrollbar{width:12px;height:12px}
  ::-webkit-scrollbar-track{background:#fff}
  ::-webkit-scrollbar-thumb{background:#c5cbd3;border:3px solid #fff;border-radius:8px;min-height:48px}
  ::-webkit-scrollbar-thumb:hover{background:#98a1ad}
  ::-webkit-scrollbar-corner{background:transparent}
  html.night ::-webkit-scrollbar-track, html.night::-webkit-scrollbar-track{background:#0c1a3c}
  html.night ::-webkit-scrollbar-thumb, html.night::-webkit-scrollbar-thumb{background:rgba(244,233,214,.24);border-color:#0c1a3c}
  html.night ::-webkit-scrollbar-thumb:hover, html.night::-webkit-scrollbar-thumb:hover{background:#f28b4b}
  html.wire ::-webkit-scrollbar-track, html.wire::-webkit-scrollbar-track{background:#050a07;border-left:1px solid rgba(0,255,65,.28)}
  html.wire ::-webkit-scrollbar-thumb, html.wire::-webkit-scrollbar-thumb{background:rgba(0,255,65,.16);border:1px solid #00ff41;border-radius:0;box-shadow:inset 0 0 0 2px #050a07}
  html.wire ::-webkit-scrollbar-thumb:hover, html.wire::-webkit-scrollbar-thumb:hover{background:#00ff41}
  @supports not selector(::-webkit-scrollbar){
    html{scrollbar-color:#c5cbd3 #fff}
    html.night{scrollbar-color:rgba(244,233,214,.3) #0c1a3c}
    html.wire{scrollbar-color:#00ff41 #050a07}
  }
  /* ---- Journey tab (a line's stations in order) -- the site's card language:
     flat, hairline rules, heavy names, small uppercase labels ---- */
  #journey{flex:1;overflow:auto;--j-ink:#1c2430;--j-muted:#6b7686;--j-rule:#e2e6eb;--j-sec:#f1f3f5;--j-sec2:#e9ecf0;--j-acc:#e8553f;--j-bg:#fff;
    background:var(--j-bg);color:var(--j-ink);padding:18px 0 28px}
  #journey.hidden{display:none !important}
  .skinsw{display:flex;background:#fff;overflow:hidden}
  .skinsw button{border:0;background:#fff;color:#333;font:600 12px/1 system-ui,sans-serif;padding:7px 10px;cursor:pointer;border-right:1px solid #ddd}
  .skinsw button:last-child{border-right:0}
  .skinsw button.on{background:#0d6e4f;color:#fff}
  html.night .skinsw, html.night .skinsw button{background:#1b2333;color:#f4e9d6;border-color:rgba(244,233,214,.16)}
  html.night .skinsw button.on{background:#f5c453;color:#1b2333}
  html.wire .skinsw, html.wire .skinsw button{background:#000;color:#00ff41;border-color:rgba(0,255,65,.3);border-radius:0}
  html.wire .skinsw button.on{background:#00ff41;color:#000}
  #journey:not(.jx){scrollbar-gutter:stable}
  /* stacked (narrow window): one column, the same 22 px between every block
     and at the top and bottom as the wide layout's padding */
  .j-stack{display:flex;flex-direction:column;gap:22px;padding:22px 0}
  .j-stack > *{margin-top:0 !important;margin-bottom:0 !important}
  .j-stack .j-low{row-gap:22px}
  .j-stack .j-card{padding-top:12px}
  /* the figures as an even grid (no ragged wrap, no stray dividers) */
  .j-stack .j-stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));column-gap:22px}
  .j-stack .j-stat{margin:0;padding:9px 0;border-right:0;border-bottom:1px solid var(--j-rule);min-width:0}
  .j-stack .j-stat.long{grid-column:1/-1}
  .j-stat b:has(.j-dep){display:block}
  .j-stat span:empty{display:none}
  .j-dep{border-collapse:collapse;margin:0;font-weight:600;line-height:1.35}
  .j-dep th{font-size:.7rem;font-weight:400;color:var(--j-muted);text-transform:uppercase;letter-spacing:.07em;text-align:left;padding:0 14px 0 0;line-height:1.2}
  .j-dep td{padding:1px 14px 1px 0;white-space:nowrap;vertical-align:top}
  .j-dep td:first-child,.j-dep th:first-child{white-space:normal}
  .j-dep td:last-child,.j-dep th:last-child{padding-right:0}
  .j-dep td.t{font-variant-numeric:tabular-nums}
  html.night #journey{--j-ink:#f4e9d6;--j-muted:rgba(244,233,214,.6);--j-rule:rgba(244,233,214,.16);
    --j-sec:rgba(244,233,214,.05);--j-sec2:rgba(244,233,214,.09);--j-acc:#f5c453;--j-bg:#0c1a3c}
  html.wire #journey{--j-ink:#c8f7d2;--j-muted:rgba(0,255,65,.55);--j-rule:rgba(0,255,65,.28);
    --j-sec:rgba(0,255,65,.04);--j-sec2:rgba(0,255,65,.08);--j-acc:#00ff41;--j-bg:#050a07;font-family:Consolas,"Courier New",monospace}
  .j-msg{padding:60px 24px;text-align:center;color:var(--j-muted)}
  .j-status{margin:0 var(--jm,44px) 12px;padding:9px 0 9px 12px;border-left:3px solid var(--j-acc);font-size:.88rem}
  .j-stats{display:flex;flex-wrap:wrap;margin:0 var(--jm,44px) 6px;border-top:1px solid var(--j-rule)}
  .j-stat{padding:10px 22px 10px 0;margin-right:22px;border-right:1px solid var(--j-rule);min-width:0}
  .j-stat:last-child{border-right:0}
  .j-stat span,.j-kick,.j-ix span,.j-hop span{display:block;font-size:.7rem;color:var(--j-muted);text-transform:uppercase;letter-spacing:.07em}
  .j-stat b{font-weight:600;font-size:1.02rem}
  .j-src{font-size:.72rem;color:var(--j-muted);margin-left:6px;text-decoration:underline dotted}
  .j-est{font-style:normal;font-size:.68rem;color:var(--j-muted);border:1px solid var(--j-rule);border-radius:3px;padding:0 4px;margin-left:4px;white-space:nowrap}
  .j-wrap{position:relative}
  .j-band{display:block;width:100%;cursor:crosshair;user-select:none}
  .j-sec{fill:var(--j-sec)} .j-sec.alt{fill:var(--j-sec2)}
  .j-cc{fill:var(--j-muted);font-size:11px;text-anchor:middle;letter-spacing:.08em}
  .j-border{stroke:var(--j-muted);stroke-width:1;stroke-dasharray:3 3}
  .j-line{stroke-width:8;stroke-linecap:round}
  .j-cont{fill:none;stroke:var(--j-muted);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .j-gap{stroke:var(--j-bg);stroke-width:4;stroke-dasharray:4 5}
  .j-stub{stroke:var(--j-muted);stroke-width:1.5}
  .j-stubb{fill:none;stroke:var(--j-muted);stroke-width:2;opacity:.35;stroke-linecap:round}
  .j-branch{fill:none;stroke-width:3;opacity:.4;stroke-linecap:round}
  .j-blab{fill:var(--j-ink);opacity:.62;font-size:10.5px}
  .j-stop{fill:var(--j-bg);stroke:var(--c);stroke-width:2.2}
  .j-stop.ix{stroke-width:3}
  .j-stop.pass{opacity:.45}
  .j-stop.on{fill:var(--j-acc);stroke:var(--j-ink);stroke-width:2.5;opacity:1}
  .j-lab{fill:var(--j-ink);font-size:11.5px} .j-lab.pass{opacity:.5}
  .j-lab.on{fill:var(--j-acc);font-weight:700;font-size:13px;opacity:1}
  .j-hint{fill:var(--j-muted);font-size:11px}
  .j-ov line{stroke-width:3;stroke-linecap:round;opacity:.35}
  .j-ov circle{opacity:.5}
  .j-ovwin{fill:var(--j-acc);fill-opacity:.16;stroke:var(--j-acc);stroke-width:1.5;cursor:grab}
  .j-ov{cursor:pointer}
  .j-low{display:flex;gap:32px;margin:6px var(--jm,44px) 0;align-items:flex-start;flex-wrap:wrap}
  /* the station: no box -- a hairline rule, kicker, heavy name, like a card */
  .j-card{flex:1 1 420px;min-width:0;border-top:1px solid var(--j-rule);padding:12px 0 4px;position:relative}
  .j-card-h{margin-top:3px} .j-card-h b{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
  .j-nat{margin-left:10px;color:var(--j-muted)}
  .j-card-m{margin-top:3px;color:var(--j-muted);font-size:.85rem;line-height:1.55}
  .j-hops{display:flex;margin-top:12px;border-top:1px solid var(--j-rule)}
  .j-hop{flex:1;text-align:left;border:0;background:none;color:var(--j-ink);padding:9px 14px 9px 0;cursor:pointer;font:inherit}
  .j-hop + .j-hop{padding-left:14px;border-left:1px solid var(--j-rule)}
  .j-hop.end{cursor:default;color:var(--j-muted)}
  .j-hop b{display:block;font-weight:600;margin-top:2px} .j-hop em{display:block;font-style:normal;font-size:.78rem;color:var(--j-muted)}
  .j-hop[data-i]:hover b{color:var(--j-acc)}
  .j-ix{padding-top:10px;border-top:1px solid var(--j-rule);display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .j-ix span{margin-right:6px}
  .j-badge{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;border:1px solid var(--j-rule);border-radius:3px;padding:1px 6px;color:var(--j-ink);text-decoration:none}
  .j-badge i{width:8px;height:8px;border-radius:2px;flex:none}
  .j-badge:hover{border-color:var(--j-acc)} .j-badge.metro{border-color:var(--j-acc)}
  /* Schematic: a computer-vision box, green brackets at its corners, square badges */
  html.wire .j-card{border-top:0;padding:14px 16px 8px;background:
    linear-gradient(#00ff41,#00ff41) top left/14px 2px no-repeat, linear-gradient(#00ff41,#00ff41) top left/2px 14px no-repeat,
    linear-gradient(#00ff41,#00ff41) top right/14px 2px no-repeat, linear-gradient(#00ff41,#00ff41) top right/2px 14px no-repeat,
    linear-gradient(#00ff41,#00ff41) bottom left/14px 2px no-repeat, linear-gradient(#00ff41,#00ff41) bottom left/2px 14px no-repeat,
    linear-gradient(#00ff41,#00ff41) bottom right/14px 2px no-repeat, linear-gradient(#00ff41,#00ff41) bottom right/2px 14px no-repeat}
  html.wire .j-card-h b{color:#000;background:#00ff41;padding:0 6px}
  html.wire .j-badge, html.wire .j-est{border-radius:0}
  html.night .j-card-h b{color:#f5c453}
  .j-side{flex:0 0 200px;display:flex;flex-direction:column;gap:10px}
  /* one screen: a centred 2 x 2 grid -- map | figures, line | station */
  #journey.jx:not(.hidden){display:grid;justify-content:center;align-content:start;column-gap:22px;padding:22px;overflow:hidden}   /* the same 22 px on all four sides */

    // leave the frame: a metro box's city page opens as the whole page
    document.getElementById('mpage').target = '_top';
  }
  // Every path in cities.js / night_maps.js is relative to the SITE ROOT, but
  // this page lives in pages/. Resolve them here, at the point of loading, so
  // the data stays root-relative for index.html. URLs and already-relative
  // paths pass through untouched.
  const up = p => (!p || /^(?:[a-z][a-z0-9+.-]*:|\/|\.\.\/)/i.test(p)) ? p : '../' + p;
  let slug = params.get('city');
  let city = CITIES.find(c => c.slug === slug);
  const yslug = params.get('y');
  if (!city && yslug && typeof YCITIES !== 'undefined'){
    const yc = YCITIES.find(c => c.slug === yslug);
    if (yc){
      slug = yc.slug;
      // official operator map replaces the rendered Yandex scheme when we have it
      city = {slug: yc.slug, en: yc.en, cn: (yc.native && yc.native !== yc.en ? yc.native : ''),
              system: yc.official ? 'Official operator map' : 'Yandex Metro scheme',
              aliases: yc.aliases || [], center: yc.center, noGcj: true, isYandex: true,
              files: {network: yc.official || yc.svg, planning: null, geo: yc.geo}, align: null};
    }
  }
  const aslug = params.get('a');
  if (!city && aslug && typeof ACITIES !== 'undefined'){
    const ac = ACITIES.find(c => c.slug === aslug);
    if (ac){
      slug = ac.slug;
      city = {slug: ac.slug, en: ac.en, cn: (ac.native !== ac.en ? ac.native : ''),
              system: ac.mapCredit ? ('Map by ' + ac.mapCredit) : 'Official operator map', aliases: ac.aliases || [], center: ac.center,
              noGcj: ac.noGcj !== false, isYandex: false, isAsia: true,
              files: {network: ac.official || null, planning: null, geo: ac.geo,
                      alt: ac.altMap || null}, altCredit: ac.altCredit || '', align: null};
    }
  }
  // Intercity / high-speed NETWORKS. Not a city: there is no radius and no
  // operator map, so it opens straight on the Google tab and fits its bbox.
  const islug = params.get('i');
  if (!city && islug && typeof ILINES !== 'undefined'){
    const ic = ILINES.find(c => c.slug === islug);
    // `geo` is no longer shipped in cities.js (it was derivable and cost
    // 0.5 MB across 13k records) -- rebuild it here like index.html does
    if (ic && !ic.geo) ic.geo = 'maps/intercity/geo/' + ic.slug + '.geo.js';
    if (ic){
      slug = ic.slug;
      const where = (ic.countries || []).join(', ');
      const lab = lineLabel(ic);
      // the operator in English spelling too (TCDD Taşımacılık -> Tasimacilik)
      const opEn = o => { let r = opName(o); if (window.STATION_EN && STATION_EN[r]) return STATION_EN[r]; if (window.localEnglish) r = localEnglish(r, ic.countries || []);
        return window.enText ? enText(r) : r; };
      city = {slug: ic.slug, en: lab.title, cn: [lab.native, lab.brand, lab.via].filter(Boolean).join(' · '),
              system: [opEn(ic.operator), where, ic.opened ? ('opened ' + ic.opened) : '']
                        .filter(Boolean).join(' · '),
              aliases: [], center: ic.center, noGcj: true, isAsia: false,
              isIntercity: true, bbox: ic.bbox, kind: ic.kind, operator: opEn(ic.operator), countries: ic.countries || [],
              operatorNational: ic.operator_basis === 'national',      // filled in: the country's national railway
              files: {network: null, planning: null, geo: ic.geo}, align: null};
    }
  }
  // a ferry (assets/ferry_index.js, scripts/build_ferry_pages.py): opened like an
  // intercity line -- its Journey (the two ports, the crossing along its course),
  // its Google map; its files under maps/ferry/
  if (!city && islug && window.FERRY_INDEX && FERRY_INDEX[islug]){
    const [fn, a, an, b, bn, fkm, fcc, center, bbox] = FERRY_INDEX[islug];
    slug = islug;
    const isoN = c => (window.ISO_NAMES && ISO_NAMES[c]) || c;
    // one language a line: the English title, then -- only when BOTH ports have one --
    // their own names (never one port in its script beside the other in English)
    city = {slug: islug, en: `${a} – ${b}`, cn: an && bn ? `${an} – ${bn}` : '',
            system: ['Ferry', `≈ ${Math.round(fkm)} km by water`, (fcc || []).map(isoN).join(', ')].filter(Boolean).join(' · '),
            // its course is OpenStreetMap's (true GPS): shifted onto China's offset map tiles
            // like the city maps (outside mainland China nothing moves)
            aliases: [], center, noGcj: false, isAsia: false, isIntercity: true, isFerry: true, bbox, kind: 'ferry',
            operator: '', countries: fcc || [], files: {network: null, planning: null, geo: `maps/ferry/geo/${islug}.geo.js`}, align: null};
  }
  // Drawn night-train diagrams (assets/night_maps.js). The tiled world map is
  // the page; each regional/country map is a box on it that opens in a modal
  // (?n=world&r=<slug>). An old ?n=<region> link opens that region's modal.
  const nslug = params.get('n');
  const startRegion = params.get('r') || (nslug && nslug !== 'world' ? nslug : null);
  if (!city && nslug && typeof NIGHT_WORLD !== 'undefined'){
    slug = 'world';
    city = {slug, en: NIGHT_WORLD.title, cn: '', system: 'Map by ' + NIGHT_CREDIT,
            aliases: [], isNight: true,
            files: {network: null, planning: null, geo: null, pdf: NIGHT_WORLD.pdf,
                    tiles: ABSTRACT ? {...NIGHT_WORLD.tiles,
                      url: 'maps/intercity/diagrams/tiles/night-world-abstract/{z}/{x}/{y}.png?v=1794890148'}
                      : NIGHT_WORLD.tiles,
                    inset: ABSTRACT ? 'maps/intercity/diagrams/night-world-abstract-inset.png' : NIGHT_WORLD.inset},
            align: null};
    const pdf = document.getElementById('pdf');
    pdf.href = up(city.files.pdf); pdf.classList.remove('hidden');
  }

  if (!city){ document.getElementById('msg').textContent = 'Unknown city.'; throw new Error('unknown city'); }

  let tab = params.get('kind') || (city.isIntercity ? 'journey' : 'maps');
  if (!['gmap', 'journey'].includes(tab)) tab = 'maps';   // legacy kinds (network/planning/official)
  if (tab === 'journey' && !city.isIntercity) tab = 'maps';
  if (tab === 'maps' && !city.files.network && !city.files.planning && !city.files.tiles) tab = city.isIntercity ? 'journey' : 'gmap';

  const enParts = [city.en, ...(city.aliases || []).map(a => a.en || a)].filter(Boolean);
  const cnParts = [city.cn, ...(city.aliases || []).map(a => a.cn || a.native || a.en || a)]
    .filter(Boolean);
  // the main city, as on its card; the other cities it serves in the small line
  const enTitle = enParts[0] || '';
  const native0 = cnParts.length === enParts.length ? cnParts[0] : '';
  const cnTitle = native0 && native0 !== enTitle ? native0 : '';
  const others = enParts.slice(1).join(', ');
  // its names in its country's other official / regional languages (Urumqi:
  // ئۈرۈمچى; Hohhot: ᠬᠥᠬᠡᠬᠣᠲᠠ -- assets/place_langs.js), after its own
  const PL = window.PLACE_LANGS || {};
  const plKey = [city.cn, city.native, enTitle].find(k => k && (PL[k] || PL[String(k).replace(/(市|县|縣)$/, '')]));
  const plNames = plKey ? (PL[plKey] || PL[String(plKey).replace(/(市|县|縣)$/, '')]).map(([, t]) => t).filter(t => t !== cnTitle && t !== enTitle) : [];
  document.getElementById('title').innerHTML =
    `${enTitle} <small>${[cnTitle, ...plNames, others, city.system || ''].filter(Boolean).join(' · ')}</small>`;

  // ---------- tab switching ----------
  const stage = document.getElementById('stage');
  const gmapEl = document.getElementById('gmap');
  const tabBtns = document.querySelectorAll('#tabs button');
  tabBtns.forEach(b => {
    const t = b.dataset.tab;
    // An intercity LINE has no operator map image, so the Maps tab is dead
    // weight -- hide it outright rather than showing a disabled button.
    if (t === 'maps' && city.isIntercity) { b.remove(); return; }
    if (t === 'journey' && !city.isIntercity) { b.remove(); return; }
    if (city.isNight) { b.remove(); return; }   // image only: no tabs at all
    if (t === 'maps' && !city.files.network && !city.files.planning) b.disabled = true;
    if (t === 'gmap' && !city.files.geo) b.disabled = true;
    b.addEventListener('click', () => setTab(t));
  });

  if (city.isNight) document.getElementById('tabs').classList.add('hidden');

  // second map shown alongside the official one (e.g. railmaps.com.au)
  const srcs = document.getElementById('srcs');
  let mapSrc = 'network';
  if (city.files.alt){
    document.getElementById('srcAlt').textContent = city.altCredit || 'Third party';
    srcs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      mapSrc = b.dataset.src;
      srcs.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      document.querySelector('#title small').textContent =
        `${cnTitle}${cnTitle ? ' · ' : ''}${mapSrc === 'alt' ? 'Map by ' + city.altCredit : (city.system || '')}`;
      setTab('maps');
    }));
  }

  function setTab(t){
    if (IN_CN){ const gb = document.querySelector('button[data-tab="gmap"]'); if (gb) gb.textContent = 'Map'; }   // its base map: Google, Amap or Baidu
    tab = t;
    tabBtns.forEach(b => b.classList.toggle('on', b.dataset.tab === t));
    const png = t === 'maps';
    stage.classList.toggle('hidden', !png);
    gmapEl.classList.toggle('hidden', t !== 'gmap');
    document.getElementById('journey').classList.toggle('hidden', t !== 'journey');
    document.getElementById('fit').style.display = png ? '' : 'none';
    document.getElementById('full').style.display = png ? '' : 'none';
    const qk = city.isIntercity ? `i=${encodeURIComponent(slug)}` : city.isNight ? `n=${slug}` : city.isHist ? `h=${slug}` : city.isAsia ? `a=${slug}` :
               city.isYandex ? `y=${slug}` : `city=${slug}`;
    // every other setting of the address kept (modal=, embed=, skin=, v=): a
    // reload -- the base map switch -- must stay in the pop-up
    { const u = new URLSearchParams(location.search); for (const [k, v] of new URLSearchParams(qk)) u.set(k, v); u.set('kind', t);
      history.replaceState(null, '', `viewer.html?${u.toString()}`); }
    srcs.classList.toggle('hidden', !(city.files.alt && t === 'maps'));
    if (t === 'maps' && city.files.tiles) initTiles();
    else if (t === 'maps')
      loadView(mapSrc === 'alt' ? city.files.alt : (city.files.network || city.files.planning),
               mapSrc !== 'alt' && !!(city.files.network && city.files.planning));
    else if (t === 'journey') initJourney();
    else initGmap();
    document.title = `${city.en} · ${t}`;
  }

  // ---------- prev / next ----------
  // every metro (all three collections), in alphabetical order -- it used to
  // walk the Chinese list only
  const nav = document.getElementById('nav');
  const METROS = [...CITIES.map(c => ({en: c.en, q: `city=${c.slug}`})),
                  ...(typeof YCITIES !== 'undefined' ? YCITIES : []).map(c => ({en: c.en, q: `y=${c.slug}`})),
                  ...(typeof ACITIES !== 'undefined' ? ACITIES : []).map(c => ({en: c.en, q: `a=${c.slug}`}))]
                 .sort((a, b) => a.en.localeCompare(b.en));
  const myQ = city.isNight || city.isHist || city.isIntercity ? null
            : city.isAsia ? `a=${slug}` : city.isYandex ? `y=${slug}` : `city=${slug}`;
  const pos = myQ ? METROS.findIndex(m => m.q === myQ) : -1;
  const goTo = m => keepModal(`viewer.html?${m.q}&kind=${tab}`);
  const prevM = pos > 0 ? METROS[pos - 1] : null, nextM = pos >= 0 && pos < METROS.length - 1 ? METROS[pos + 1] : null;
  if (params.has('inmodal')){
    const arrow = d => `<svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    if (prevM) nav.insertAdjacentHTML('beforeend', `<a class="btn ibtn" title="Previous: ${prevM.en}" aria-label="Previous: ${prevM.en}" href="${goTo(prevM)}">${arrow('M10 3 5 8l5 5')}</a>`);
    if (nextM) nav.insertAdjacentHTML('beforeend', `<a class="btn ibtn" title="Next: ${nextM.en}" aria-label="Next: ${nextM.en}" href="${goTo(nextM)}">${arrow('M6 3l5 5-5 5')}</a>`);
  } else {
    if (prevM) nav.innerHTML += `<a href="${goTo(prevM)}">&#8592; ${prevM.en}</a> `;
    if (nextM) nav.innerHTML += `<a href="${goTo(nextM)}">${nextM.en} &#8594;</a>`;
  }
  window.addEventListener('keydown', e => {
    if (city.isNight){
      if (e.key === 'Escape') closeNight();
      if (e.key === 'f') (mmap ? mmap.fitAll() : fit());
      return;
    }
    if (e.key === 'f') fit();
    if (e.key === 'ArrowLeft' && prevM) location.href = goTo(prevM);
    if (e.key === 'ArrowRight' && nextM) location.href = goTo(nextM);
  });

  // ---------- compare stage: shared pan/zoom, before/after divider ----------
  const imgA = document.getElementById('imgA');   // network (left)
  const imgB = document.getElementById('imgB');   // planning (right)
  const clipB = document.getElementById('clipB');
  const divider = document.getElementById('divider');
  const chipA = document.getElementById('chipA');
  const chipB = document.getElementById('chipB');
  const hud = document.getElementById('hud');
  const msg = document.getElementById('msg');

  let scale = 1, min = .05, max = 8, tx = 0, ty = 0;
  let split = 0.5;            // divider position, fraction of stage width
  let hasB = false, started = false;
  const svgA = document.getElementById('svgA');
  let layerA = imgA;          // active primary layer: <img> for PNG, inline div for SVG
  let natW = 0, natH = 0;     // natural size of the primary layer

  let curSrc = null;
  // an SVG map's size in px: its own px width/height if it has them, else its
  // viewBox; a small one (mm-based drawings, 128 x 145) scaled up to 2000 px
  // so "100%" stays a readable size -- it is vector, nothing blurs
  function svgSize(sv){
    const px = v => { const m = String(v || '').trim().match(/^([\d.]+)(px)?$/); return m ? +m[1] : 0; };
    const vb = (sv.getAttribute('viewBox') || '').trim().split(/[\s,]+/).map(Number);
    let w = px(sv.getAttribute('width')), h = px(sv.getAttribute('height'));
    if (!(w && h) && vb.length === 4 && vb[2] > 0 && vb[3] > 0){ w = vb[2]; h = vb[3]; }
    if (!(w && h)){ const b = sv.getBBox ? sv.getBBox() : null; w = (b && b.width) || 1000; h = (b && b.height) || 1000; }
    const k = Math.max(1, 2000 / Math.max(w, h));
    return [Math.round(w * k), Math.round(h * k)];
  }
  function loadView(a, withB){
    if (!a){ msg.style.display = 'flex'; msg.textContent = 'No map available.'; return; }
    hasB = withB;
    // compare layer + chrome (only the China network/planning pair uses it)
    if (hasB && !imgB.src) imgB.src = up(city.files.planning);
    if (!city.files.network){ chipA.textContent = 'Planning'; }
    clipB.style.display = hasB ? '' : 'none';
    divider.style.display = hasB ? '' : 'none';
    chipB.style.display = hasB ? '' : 'none';
    chipA.style.display = hasB ? '' : 'none';   // chips only matter when comparing
    imgB.onload = computeAlign;
    if (curSrc === a){ fit(); return; }
    curSrc = a;
    msg.style.display = 'flex'; msg.textContent = 'Loading…';
    if (/\.svg$/i.test(a) && location.protocol !== 'file:'){
      // inline the SVG: vector DOM re-renders crisply at every zoom level,
      // unlike an <img> whose one-time rasterization blurs when scaled
      imgA.style.display = 'none';
      svgA.style.display = '';
      fetch(up(a)).then(r => r.text()).then(txt => {
        svgA.innerHTML = txt;
        const sv = svgA.querySelector('svg');
        // its true proportions: the viewBox -- width/height are often missing
        // (Tianshui: viewBox only) or in mm / pt / % (Genoa 194mm, Tallinn
        // 100%), which read as pixels gave a 1000x1000 square or a postage stamp
        [natW, natH] = svgSize(sv);
        sv.setAttribute('width', natW); sv.setAttribute('height', natH);
        sv.style.display = 'block';
        layerA = svgA;
        msg.style.display = 'none';
        computeAlign(); fit(); stage.classList.remove('loading'); pageReady();
      }).catch(() => { msg.textContent = 'Could not load ' + a; });
      return;
    }
    svgA.style.display = 'none';
    svgA.innerHTML = '';
    imgA.style.display = '';
    stage.classList.add('loading');
    imgA.src = up(a);
    // an SVG shown as an image (file://, where its text cannot be read): its
    // true size from assets/svg_sizes.js, drawn at that size -- the image's own
    // natural size is the browser's 300 px default for most of them
    const known = /\.svg$/i.test(a) && window.SVG_SIZES && window.SVG_SIZES[a.split('?')[0]];
    imgA.style.width = known ? known[0] + 'px' : ''; imgA.style.height = known ? known[1] + 'px' : '';
    imgA.onload = () => { natW = known ? known[0] : imgA.naturalWidth; natH = known ? known[1] : imgA.naturalHeight;
                          layerA = imgA; msg.style.display = 'none'; computeAlign(); fit();
                          stage.classList.remove('loading'); pageReady(); };
    imgA.onerror = () => { if (imgA.src) msg.textContent = 'Could not load ' + a; };
  }

  // Planning layer base transform mapping its pixels into the network map's
  // coordinate space: network_px = bs * planning_px + (bdx, bdy).
  // Comes from offline pixel registration (scripts/align_maps.py); falls back
  // to width-fit when registration confidence was too low.
  let bs = 1, bdx = 0, bdy = 0;
  function computeAlign(){
    if (!hasB || !natW || !imgB.naturalWidth) return;
    const al = city.align;
    if (al && al.score >= 0.08){ bs = al.s; bdx = al.dx; bdy = al.dy; }
    else { bs = natW / imgB.naturalWidth; bdx = 0; bdy = 0; }
    apply();
  }

  function apply(){
    const t = `translate(${tx}px,${ty}px) scale(${scale})`;
    layerA.style.transform = t;
    imgB.style.transform = `${t} translate(${bdx}px,${bdy}px) scale(${bs})`;
    hud.textContent = `${Math.round(scale*100)}%  ·  ${natW}×${natH}px`;
    applySplit();
  }
  function applySplit(){
    if (!hasB) return;
    const w = stage.getBoundingClientRect().width;
    const x = split * w;
    clipB.style.clipPath = `inset(0 0 0 ${x}px)`;
    divider.style.left = x + 'px';
    // hide the "Network" chip once the divider covers it, and vice versa
    chipA.style.opacity = x < 90 ? 0 : 1;
    chipB.style.opacity = x > w - 100 ? 0 : 1;
  }
  // Deep-zoom diagrams (night_maps.js `tiles`): far too big for one <img>
  // (the world night map is 388 MP), so they go through Leaflet as a
  // CRS.Simple tile pyramid whose deepest level is the original pixels.
  // Built by scripts/tile_diagram.py.
  // A CRS.Simple map over a w x h px image that is 1:1 at zoom `nz`. Zoomed
  // all the way out = the whole image fitted to the window on whichever side
  // is limiting; it can't shrink past that or be dragged off the image.
  function simpleMap(id, w, h, nz, maxZoom){
    // embedded world map: no +/- (the home page puts its Schematic switch
    // there; wheel / pinch still zoom). The modal keeps its buttons.
    const m = L.map(id, {crs: L.CRS.Simple, zoomSnap: 0, zoomDelta: 0.5, maxZoom,
                         maxBoundsViscosity: 1, attributionControl: false,
                         zoomControl: !(EMBED && id === 'lmap')});
    m.pxBounds = L.latLngBounds(m.unproject([0, h], nz), m.unproject([w, 0], nz));
    m.native = nz;
    m.setMaxBounds(m.pxBounds);
    // getBoundsZoom clamps to the CURRENT minZoom (Leaflet default 0, which
    // pinned an 8000 px modal map at 1:1); lift the clamp before measuring
    // The home page's world map (abstract / schematic in its card) FILLS the
    // card: zoomed out as far as the world still covers it edge to edge --
    // no bands of margin above and below; panning stops at the world's edge.
    // A modal map image still fits whole.
    const cover = EMBED && id === 'lmap';
    const floor = () => { m.options.minZoom = -Infinity;
                          m.setMinZoom(m.getBoundsZoom(m.pxBounds, cover)); };
    const fit = () => cover ? m.setView(m.pxBounds.getCenter(), m.getMinZoom(), {animate: false})
                            : m.fitBounds(m.pxBounds, {animate: false});
    m.fitAll = () => { floor(); fit(); };
    // a map sitting at fit stays at fit when its box changes size
    m.on('resize', () => { const wasFit = m.getZoom() <= m.getMinZoom() + 1e-3;
                           floor(); if (wasFit) fit(); });
    // Leaflet only re-measures on WINDOW resize; watch the container itself
    // so modal / layout changes re-measure too
    // (stops when the map is removed: a modal map that closed kept being
    // re-measured, and threw)
    if (window.ResizeObserver){
      const ro = new ResizeObserver(() => m.getContainer().isConnected && m.invalidateSize({pan: false}));
      ro.observe(m.getContainer());
      m.on('unload', () => ro.disconnect());
    }
    m.fitAll();
    return m;
  }

  let tmap = null;
  // Margin round the world map. Embedded, it takes the map's own sea colour
  // so the drawing runs edge to edge in the home page's card.
  const MARGIN = ABSTRACT ? [0x0c, 0x1a, 0x3c] : WIRE ? [0x05, 0x0a, 0x07] : EMBED ? [0xdc, 0xde, 0xd3] : [0xe9, 0xec, 0xf0];
  const MARGIN_CSS = `rgb(${MARGIN.join(',')})`;
  function initTiles(){
    if (MODALONLY) return;
    const T = city.files.tiles;
    stage.classList.add('hidden');
    gmapEl.classList.remove('hidden');
    if (tmap){ tmap.invalidateSize(); return; }
    document.getElementById('lmap').style.background = MARGIN_CSS;
    // abstract mode zooms much deeper: its lines are vectors (a city's metro
    // is only ~60-90 world px), the flat base takes the upscaling fine
    const ZMAX = T.maxZoom + (ABSTRACT ? 7 : 2);      // (128x: Tokyo's 24 px box opens to ~3000 px)
    tmap = simpleMap('lmap', T.w, T.h, T.maxZoom, ZMAX);
    if (EMBED){
      let tip = null;
      const send = () => {
        if (!tip){ parent.postMessage({type: 'tip', html: null}, '*'); return; }
        const p = tmap.latLngToContainerPoint(tip.getLatLng());
        const r = document.getElementById('lmap').getBoundingClientRect();
        parent.postMessage({type: 'tip', html: tip.getElement() ? tip.getElement().innerHTML : '',
                            x: p.x + r.left, y: p.y + r.top}, '*');
      };
      tmap.on('tooltipopen', e => { tip = e.tooltip; send(); });
      tmap.on('tooltipclose', () => { tip = null; send(); });
      tmap.on('mousemove zoom move', () => { if (tip) send(); });
      document.addEventListener('mouseleave', () => { tip = null; send(); });
    }
    // wireframe: the pre-rendered green tiles (scripts/build_wire_tiles.py) -- no live filter, no pan lag
    tmap.tiles = L.tileLayer(up(WIRE ? T.url.replace('/night-world/', '/night-world-wire/') : T.url), {maxNativeZoom: T.maxZoom, maxZoom: ZMAX,
                                         bounds: tmap.pxBounds, noWrap: true}).addTo(tmap);
    if (city.isNight && ABSTRACT) addAbstract();
    else if (city.isNight) addNightBoxes();
    if (city.files.inset) addInset();

  // a metro stop: its name, the city, and for every line calling here the

    country: {label: 'Country',            col: '#1565c0', lead: 1.5,

    // a region inside a country (night_maps.js kind 'area': a German state, a
    // TER region, a Russian oblast's suburban network, a Cercanías city ...):
    // its own level and legend entry, between country and metro -- there are
    // too many to share the country level (16 Nov 2026)

    // terminal green: the metro level is viewed over the NEGATIVE world map,

    const seen = new Set(), st = [];
    for (const e of cityStationAt.values()){
      if (![...e.labs].some(l => l === lab || cleanName(l) === lab)) continue;
      const nm = [...e.names][0] || 'Station', key = stationKey(nm);
      if (seen.has(key)) continue;
      seen.add(key);
      const [lng, lat] = e.src;
      st.push({n: nm, key, t: along(lng, lat)});
    }
    st.sort((a, b) => a.t - b.t);
    lineStops.set(lab, st);
    return st;
  }
  function ownLineCard(lab, nm, zh, col, cat){
    const st = stopsOfLine(lab), N = st.length;
    const catName = (CATS.find(([k]) => k === cat) || [, cat])[1];
    return lineCard(col, nm + (zh && zh !== nm ? ' / ' + zh : ''),
      [city.en, catName, N > 1 ? N + ' stops' : ''].filter(Boolean).join(' · '),
      N > 1 ? [st[0].n, st[N - 1].n] : null);
  }
  function cityStopCard(e){
    const name = [...e.names].join(' / ') || 'Station';
    const labs = [...new Set([...e.labs].map(l => labelGeo.has(l) ? l : cleanName(l)))]
      .filter(l => !activeCats.size || activeCats.has(labelCat.get(l)));       // only lines shown
    const me = stationKey([...e.names][0]);
    const rows = labs.map(lab => {
      const st = stopsOfLine(lab);
      return stopRow(labelCol.get(lab) || '#888', labelName.get(lab) || lab, st.map(x => x.n), st.findIndex(x => x.key === me));
    });
    return stationCard(name, city.en || '', rows, labs.length, 5, [...e.names]);
  }
  function cleanName(s){
    if (!s) return s;
    return s.split(':')[0]
      .replace(/^(地铁|轨道交通|城市轨道交通|有轨电车)\s*/, '')
      .replace(/\s*[（(][^）)]*(方向|环)[^）)]*[）)]\s*$/, '')
      .trim();
  }

  // OSM usually has one relation PER DIRECTION of the same line — without
  // dedupe every line paints twice. Key on ref + base name + sorted endpoints
  // so "A → B" and "B → A" collapse but real branches stay separate.
  function dirKey(p, colour){
    const raw = (p.name || '').trim();
    const ref = (p.ref || '').trim();
    if (!raw && !ref) return null;                 // unnamed: never dedupe
    const AR = /(?:→|⇒|—>|-->|->|==>)/;
    let base = raw, ends = '';
    let m = raw.match(/^(.*?)[（(]([^（()）]*(?:→|⇒|-->|->|==>)[^（()）]*)[）)]\s*$/);
    if (!m) m = raw.match(/^(.*?)[:：](.*(?:→|⇒|-->|->|==>).*)$/);
    if (!m && AR.test(raw)) m = [null, '', raw];
    if (m){
      base = (m[1] || '').trim();
      ends = m[2].split(AR).map(s => s.trim()).filter(Boolean).sort().join('~');
    }
    base = base.replace(/[（(][^（()）]*(?:bound|方向|环行?|上行|下行)[^（()）]*[）)]/ig, '')
               .replace(/\b(east|west|north|south)bound\b/ig, '')
               .replace(/(上行|下行|内环|外环)/g, '')
               .replace(/\s+/g, ' ').trim();
    return `${ref}|${base}|${ends}|${p.route || ''}|${colour}`;
  }

  let stationsLayer = null;
  let catLayers = null;
  let ownCounts = {};            // categories the open city has a toggle for
  const otherLayers = {};        // other cities' lines, per category
  function otherOn(k){
    // a category with a toggle follows the toggle; one the open city lacks
    // (so has no checkbox) follows the default for the current mode
    return ownCounts[k] ? !!(activeCats && activeCats.has(k)) : defaultOn(k);
  }
  // The WHOLE world's intercity network, not just the long-distance runs
  // that happen to fall inside some city's radius (mostly European, which is
  // why only Europe lit up). One decimated file, loaded once, into the same
  // Intercity toggle.
  let ilWorldLoaded = false;
  function loadIntercityWorld(){
    if (ilWorldLoaded || !lmap || city.isIntercity) return;
    if (modeCats && !modeCats.includes('intercity')) return;
    ilWorldLoaded = true;
    const s = document.createElement('script');
    s.src = up('assets/intercity_overview.js');
    s.onload = () => {
      const g = window.__ILGEO || {};
      const names = new Map((typeof ILINES !== 'undefined' ? ILINES : [])
                             .map(c => [c.slug, c.name]));
      const KCOL = (typeof KIND_COLOUR !== 'undefined') ? KIND_COLOUR : {};
      for (const [sl, v] of Object.entries(g)){
        if ((window.HIDDEN_LINES || {})[sl]) continue;
        const segs = (v && v.s) || v;
        if (!Array.isArray(segs)) continue;
        const latlngs = segs.map(seg => seg.map(([lng, lat]) => wgs2gcj(lat, lng, sl, false)));
        L.polyline(latlngs, {color: KCOL[v.k] || '#111827', weight: 2.5, opacity: .75})
          .bindTooltip(() => icTip(sl, v.k || 'intercity', KCOL[v.k] || '#111827'), {...TT, className: 'tt day'})
          .on('click', () => location.href = keepModal(`viewer.html?i=${encodeURIComponent(sl)}&kind=gmap`))
          .addTo(otherLayer('intercity'));
      }
    };
    document.body.appendChild(s);
  }
  function otherLayer(k){
    if (!otherLayers[k]){
      otherLayers[k] = L.layerGroup();
      if (otherOn(k)) otherLayers[k].addTo(lmap);
    }
    return otherLayers[k];
  }
  let stationRecs = [];          // {m, cats:Set} -- a station can serve several
  let activeCats = null;
  let fitToActive = null;
  function updateStationVisibility(){
    if (!stationsLayer || !lmap) return;
    if (!lmap.hasLayer(stationsLayer)) stationsLayer.addTo(lmap);
  }

  // A dot stays only while at least one category serving it is still on --
  // otherwise turning every line off left a field of orphan stations behind.
  function applyStationFilter(){
    if (!stationsLayer || !activeCats) return;
    for (const rec of stationRecs){
      const show = rec.cats.size === 0
        ? false                               // truly unattributable: hide
        : [...rec.cats].some(c => activeCats.has(c));
      if (show){
        if (!stationsLayer.hasLayer(rec.m)) rec.m.addTo(stationsLayer);
        // paint it as the category actually on screen
        const on = [...rec.cats].find(c => activeCats.has(c));
        const col = (on && rec.catCol && rec.catCol[on]) || rec.base;
        if (col) rec.m.setStyle({fillColor: col});
      }
      else if (stationsLayer.hasLayer(rec.m)) stationsLayer.removeLayer(rec.m);
    }
  }

  // Which filter bucket a line belongs to. `intercity` wins over the OSM route
  // tag: a 200 km city-to-city run is not a metro no matter how it is tagged.
  const CATS = [['metro','Metro / rail','#0d5c8c'],
                ['tram','Tram','#b06f09'],
                ['intercity','Intercity','#111827'],
                ['brt','BRT / bus','#7d3c98'],
                ['cable','Cable / funicular','#0097a7'],
                ['ferry','Ferry','#3d8bd4']];
  // abandoned and disused track is not part of the catalogue: no category,
  // so it is drawn nowhere (no legend entry, no count); filled gaps and
  // extensions belong to their line
  function catOf(p){
    if (p.intercity || p.gap_fill || p.extension) return 'intercity';
    const r = p.route || '';
    if (r === 'tram') return 'tram';
    if (r === 'subway' || r === 'light_rail' || r === 'monorail' || r === 'train')
      return 'metro';
    if (r === 'bus' || r === 'trolleybus') return 'brt';
    if (r === 'aerialway' || r === 'funicular' || r === 'cable_car' ||
        r === 'gondola') return 'cable';
    if (r === 'ferry') return 'ferry';                 // a ferry's page (maps/ferry/geo/)
    // dismantled corridors (OpenHistoricalMap), disused track, untagged ways
    return null;
  }

  // Long-distance services captured inside a city's radius are real data, but
  // they are not what you opened a metro map to see -- in Europe especially
  // they bury the network. Off by default, one click to bring back. On an
  // intercity LINE view they are the whole point, so they stay on.
  const DEFAULT_OFF = new Set(['intercity']);

  // The menu mode arrives as ?mode=. Metros shows metro/rail only, Trams
  // trams only, Intercity intercity only; Transits shows everything. It
  // governs the city's own lines AND the other-city networks drawn when you
  // zoom out, so a metro view never fills up with trams or long-distance runs.
  // 'metro' here means metro/rail that is NOT intercity-flagged. Without that
  // exclusion, Metros view still drew the long-distance runs captured inside
  // city radii -- the Australian, South African, Sri Lankan, Kenyan and
  // European lines showing up under Metros.
  const MODE_CATS = {metros: ['metro'], trams: ['tram'], intercity: ['intercity', 'ferry']};
  const menuMode = (params.get('mode') || '').toLowerCase();
  const modeCats = MODE_CATS[menuMode] || null;     // null = Transits / unset
  const defaultOn = k => modeCats ? modeCats.includes(k)
                                  : (!DEFAULT_OFF.has(k) || !!city.isIntercity);

  function addFilterControl(counts){
    const live = CATS.filter(([k]) => counts[k]);
    if (live.length < 2) return;          // nothing meaningful to filter
    const C = L.Control.extend({
      options: {position: 'topright'},
      onAdd: function(){
        const d = L.DomUtil.create('div', 'leaflet-bar');
        d.style.cssText = 'background:#fff;padding:6px 8px;font:12px/1.5 system-ui,' +
          'sans-serif;box-shadow:0 1px 4px rgba(0,0,0,.3);border-radius:4px';
        d.innerHTML = live.map(([k,label,col]) =>
          `<label style="display:block;white-space:nowrap;cursor:pointer">` +
          `<input type="checkbox" data-cat="${k}"${defaultOn(k) ? ' checked' : ''}` +
          ` style="vertical-align:-1px">` +
          ` <span style="display:inline-block;width:9px;height:9px;background:${col};` +
          `border-radius:2px"></span> ${label} <span style="color:#888">${counts[k]}</span>` +
          `</label>`).join('');
        L.DomEvent.disableClickPropagation(d);
        d.addEventListener('change', e => {
          const k = e.target.getAttribute('data-cat');
          if (!k) return;
          if (e.target.checked){ catLayers[k].addTo(lmap); activeCats.add(k); }
          else { lmap.removeLayer(catLayers[k]); activeCats.delete(k); }
          if (k === 'intercity' && e.target.checked) loadIntercityWorld();
          if (otherLayers[k]){
            if (e.target.checked) otherLayers[k].addTo(lmap);
            else lmap.removeLayer(otherLayers[k]);
          }
          applyStationFilter();
          if (typeof fitToActive === 'function') fitToActive();
        });
        return d;
      }
    });
    lmap.addControl(new C());
  }

  function drawGeo(gj){
    if (!gj){ return; }
    // a single-piece track (an extension) drawn like the rest
    for (const f of gj.features || [])
      if (f.geometry && f.geometry.type === 'LineString') f.geometry = {type: 'MultiLineString', coordinates: [f.geometry.coordinates]};
    const lineColour = ((gj.features || []).find(f => f.properties && f.properties.colour && !f.properties.gap_fill && !f.properties.extension) || {properties: {}}).properties.colour
      || (city.isIntercity && typeof KIND_COLOUR !== 'undefined' ? KIND_COLOUR[city.kind] : null);
    const allBounds = [];
    // bounds PER CATEGORY: fitting to everything zoomed Metro view out to the
    // full extent of 600 km intercity corridors whose layer was not even on
    const catBounds = {};
    stationsLayer = L.layerGroup();
    catLayers = {}; const counts = {};
    for (const [k] of CATS){ catLayers[k] = L.layerGroup(); counts[k] = 0; }
    stationRecs = []; activeCats = new Set();
    const stationAt = cityStationAt = new Map();   // rounded position -> the one dot there
    labelGeo.clear(); labelName.clear(); lineStops.clear();
    const pendingTips = [];
    // label -> category, so a station can inherit the categories of the lines
    // that call at it (stations carry line LABELS, not route tags)
    labelCat = new Map(); labelCol = new Map();
    // Dar es Salaam's BRT stops carry no line labels, resolved to NO category,
    // and the "unattributable" branch showed them under every toggle. A
    // label-less stop inherits the file's dominant line category instead.
    let domCat = null;
    {
      const cc = {};
      for (const f of (gj.features || [])){
        if (f.geometry && f.geometry.type === 'MultiLineString'){
          const c = catOf(f.properties || {});
          if (c) cc[c] = (cc[c] || 0) + 1;
        }
      }
      domCat = Object.keys(cc).sort((a, b) => cc[b] - cc[a])[0] || null;
    }
    for (const f of gj.features){
      if (f.geometry.type !== 'MultiLineString') continue;
      const p = f.properties || {};
      const c = catOf(p);
      if (!c) continue;                                           // abandoned / disused: not shown
      for (const lab of [p.ref, cleanName(p.name)]){
        if (!lab) continue;
        labelCat.set(lab, c);
        if (p.colour) labelCol.set(lab, p.colour);
        if (!labelGeo.has(lab)) labelGeo.set(lab, []);
        labelGeo.get(lab).push(...f.geometry.coordinates);
        if (!labelName.has(lab)) labelName.set(lab, cleanName(p.name) || p.ref);
      }
    }
    const seen = new Set();
    for (const f of gj.features){
      const p = f.properties || {};
      // A line with no colour of its own used to fall back to red, which
      // matched no swatch in the filter legend. Fall back to the CATEGORY
      // colour instead, so the legend and the map agree.
      const catColour = Object.fromEntries(CATS.map(([k, , c]) => [k, c]));
      // a filled gap or an extension has no colour of its own: its line's
      const colour = p.colour || ((p.gap_fill || p.extension) && lineColour) || catColour[catOf(p)] || '#c0392b';
      if (f.geometry.type === 'MultiLineString'){
        const dk = dirKey(p, colour);
        if (dk){ if (seen.has(dk)) continue; seen.add(dk); }
        const latlngs = f.geometry.coordinates.map(seg => seg.map(([lng,lat]) => wgs2gcj(lat,lng)));
        // All lines draw solid. Intercity services used to be dashed and
        // faded; the filter control above separates them explicitly now, so
        // the dashes only made the map noisy.
        const line = L.polyline(latlngs,
          {color: colour, weight: p.intercity ? 3 : 4, opacity: .85});
        const nm = cleanName(p.name), zh = cleanName(p.name_zh);
        const lab = labelGeo.has(p.ref) ? p.ref : nm;
        line.bindTooltip(() => ownLineCard(lab, nm || p.ref || 'Line', zh, colour, catOf(p)), {...TT, className: 'tt day'});
        const cat = catOf(p);
        line.addTo(catLayers[cat]); counts[cat]++;
        if (defaultOn(cat)) activeCats.add(cat);
        const _cb = (catBounds[catOf(p)] = catBounds[catOf(p)] || []);
        latlngs.forEach(seg => seg.forEach(ll => { allBounds.push(ll); _cb.push(ll); }));
      } else if (f.geometry.type === 'Point' && p.station){
        const [lng, lat] = f.geometry.coordinates;
        // MERGE stations that sit on the same spot. Every line carries its own
        // copy of the stations it calls at, so an interchange drew one dot per
        // line -- 691,951 pairs of same-named stops sat within 250 m of each
        // other, stacked. Round to ~100 m and keep ONE dot, folding the extra
        // lines and name variants into it.
        const pkey = lat.toFixed(3) + ',' + lng.toFixed(3);
        const prev = stationAt.get(pkey);
        if (prev){
          for (const lab of (p.lines || [])) prev.labs.add(lab);
          if (p.name) prev.names.add(p.name);
          if (p.name_zh) prev.names.add(p.name_zh);
          for (const lab of (p.lines || [])){
            const key = labelCat.has(lab) ? lab : cleanName(lab);
            const c = labelCat.get(key);
            if (!c) continue;
            prev.rec.cats.add(c);
            if (!prev.rec.catCol[c] && labelCol.get(key))
              prev.rec.catCol[c] = labelCol.get(key);
          }
          continue;
        }
        const m = L.circleMarker(wgs2gcj(lat,lng), {radius: 4, color: '#fff', weight: 1.5,
          fillColor: p.colour || '#333', fillOpacity: 1}).addTo(stationsLayer);
        // an interchange belongs to several categories; remember the colour of
        // each so the dot can repaint to whichever category is being viewed,
        // instead of keeping whichever line happened to create it
        const cats = new Set(), catCol = {};
        for (const lab of (p.lines || [])){
          const key = labelCat.has(lab) ? lab : cleanName(lab);
          const c = labelCat.get(key);
          if (!c) continue;
          cats.add(c);
          if (!catCol[c] && labelCol.get(key)) catCol[c] = labelCol.get(key);
        }
        if (cats.size === 0 && domCat) cats.add(domCat);
        const rec = {m, cats, catCol, base: p.colour || '#333'};
        stationRecs.push(rec);
        const entry = {rec, m, src: [lng, lat],
          names: new Set([p.name, p.name_zh].filter(Boolean)),
          labs: new Set(p.lines || [])};
        stationAt.set(pkey, entry);
        // the tooltip is written once at the end, when every line that calls
        // here has been folded in
        pendingTips.push(entry);
      }
    }
    // every line has been read, so each merged station now knows all the
    // services that call there
    for (const e of pendingTips){
      e.ll = e.m.getLatLng();
      e.m.bindTooltip(() => cityStopCard(e), {...TT, className: 'tt day', sticky: false});
    }
    for (const [k] of CATS) if (counts[k] && defaultOn(k)) catLayers[k].addTo(lmap);
    // a toggle exists only when the control is shown (2+ live categories)
    ownCounts = CATS.filter(([k]) => counts[k]).length >= 2 ? counts : {};
    addFilterControl(counts);
    applyStationFilter();
    // fit to the layers that are ON; refit whenever a toggle changes
    fitToActive = () => {
      const pts = [];
      for (const k of activeCats) if (catBounds[k]) pts.push(...catBounds[k]);
      const use = pts.length ? pts : allBounds;
      if (use.length) lmap.fitBounds(L.latLngBounds(use), {padding: [30, 30]});
    };
    fitToActive();
    lmap.on('zoomend', updateStationVisibility);
    updateStationVisibility();
  }

  setTab(tab);
  // ?pg=<city page query>: a pop-up opened from the Geographic map's city dot.
  // The city's own box when it has one (its maps + full details), else just
  // its full details, named by ?nm=
  const PG = params.get('pg');
  if (city.isNight && PG){
    const box = NIGHT_ALL.find(c => c.page === PG);
    if (!box) NIGHT_ALL.push({slug: 'page:' + PG, en: params.get('nm') || '', title: params.get('nm') || '', page: PG, tabs: []});
    openNight(box ? box.slug : 'page:' + PG);
  }
  else if (city.isNight && startRegion) openNight(startRegion, params.get('t'));
</script>
</body>
</html>
